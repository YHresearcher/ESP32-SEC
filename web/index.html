<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>ESP32-SEC — Flash Firmware</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  <style>
    :root{font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef5fc;background:#0b1220;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}
    main{width:100%;max-width:410px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
    .brand{font-weight:750;letter-spacing:.04em}
    button{font:inherit;cursor:pointer}
    .lang{background:transparent;border:1px solid #39506a;border-radius:9px;color:#dbe8f5;padding:7px 12px;font-size:13px}
    .panel{background:#152136;border:1px solid #31435d;border-radius:20px;padding:26px;text-align:center}
    .symbol{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:#183c45;color:#66ead0;font-size:28px}
    h1{font-size:25px;line-height:1.25;margin:0 0 8px}
    .subtitle{color:#a5b8cd;font-size:14px;margin:0 0 20px}
    .version{background:#0e1a2d;border:1px solid #283f57;border-radius:10px;padding:12px;font-size:12px;overflow-wrap:anywhere;color:#bad0e1;margin-bottom:20px}
    #installer{margin:0 auto}
    esp-web-install-button{display:block}
    esp-web-install-button::part(button){width:100%;border:none;border-radius:11px;padding:13px 20px;background:#3ed6b7;color:#08201b;font:700 16px system-ui;cursor:pointer}
    #status{font-size:13px;line-height:1.5;color:#aabed2;margin:16px 0 0}
    footer{display:flex;justify-content:center;gap:14px;margin-top:18px;font-size:12px;color:#8aa2b8}
    a{color:#9bb6cd;text-decoration:none}
    a:hover{text-decoration:underline}
    [hidden]{display:none!important}
  </style>
</head>
<body>
<main>
  <header>
    <span class="brand">ESP32-SEC</span>
    <button id="locale" class="lang" type="button" aria-label="Switch language">EN</button>
  </header>
  <section class="panel">
    <div class="symbol" aria-hidden="true">⬇</div>
    <h1 data-vi="Nạp firmware" data-en="Flash firmware">Nạp firmware</h1>
    <p class="subtitle">ESP32-S3 N16R8 · 2.8″ Touch</p>
    <div id="version" class="version" aria-live="polite">...</div>
    <div id="installer" hidden>
      <esp-web-install-button manifest="./manifest.json">
        <button slot="activate" type="button" style="width:100%;background:#3ed6b7;border:0;border-radius:11px;padding:14px;color:#07251d;font-weight:750" data-vi="Kết nối & Nạp firmware" data-en="Connect & Flash firmware">Kết nối & Nạp firmware</button>
        <span slot="unsupported" data-vi="Dùng Chrome hoặc Edge trên máy tính để nạp qua USB." data-en="Use desktop Chrome or Edge to flash over USB.">Dùng Chrome hoặc Edge trên máy tính để nạp qua USB.</span>
        <span slot="not-allowed" data-vi="Trang cần HTTPS để truy cập USB." data-en="HTTPS is required for USB access.">Trang cần HTTPS để truy cập USB.</span>
      </esp-web-install-button>
    </div>
    <p id="status" aria-live="polite"></p>
  </section>
  <footer>
    <span>Alpha · ESP32-S3</span>
    <a href="https://github.com/YHresearcher/ESP32-SEC" target="_blank" rel="noopener">GitHub</a>
  </footer>
</main>
<script src="./app.js"></script>
</body>
</html>
