name: RC Promotion — requires physical hardware evidence
on:
  workflow_dispatch:
    inputs:
      validation_json:
        description: 'Hardware test evidence JSON (all eight acceptance checks and target commit)'
        required: true
        type: string
      rc_version:
        description: 'RC version, e.g. v0.3.0-rc.1'
        required: true
        default: 'v0.3.0-rc.1'
        type: string

permissions:
  contents: write

concurrency:
  group: esp32-sec-rc-promotion
  cancel-in-progress: false

jobs:
  rc:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Verify explicitly supplied physical hardware test evidence
        shell: bash
        env:
          RC_REPORT_JSON: ${{ inputs.validation_json }}
          RC_VERSION: ${{ inputs.rc_version }}
        run: |
          set -euo pipefail
          [[ "$RC_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || {
            echo 'Invalid RC version'; exit 1;
          }
          printf '%s' "$RC_REPORT_JSON" > /tmp/sec-rc-validation.json
          python3 tools/check_rc_gate.py --report /tmp/sec-rc-validation.json --commit "$GITHUB_SHA"
          python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Generate Vietnamese font
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/sec-font
          /tmp/sec-font/bin/pip install --quiet pillow==11.3.0
          /tmp/sec-font/bin/python firmware/scripts/generate_vi_font.py
      - name: Compile exact verified commit for ESP32-S3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          path: firmware
      - name: Package RC image and traceable evidence
        shell: bash
        env:
          RC_VERSION: ${{ inputs.rc_version }}
        run: |
          set -euo pipefail
          python3 -m venv /tmp/sec-esptool
          /tmp/sec-esptool/bin/pip install --quiet "esptool>=4.9,<6"
          mkdir -p release
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          src=json.loads(Path("firmware/build/flasher_args.json").read_text())
          entries=src["flash_files"]
          cmd=["/tmp/sec-esptool/bin/python", "-m", "esptool", "--chip", "esp32s3",
               "merge-bin", "-o", "release/ESP32-SEC-RC-merged.bin",
               "--flash-mode", "dio", "--flash-freq", "80m", "--flash-size", "16MB"]
          for offset, path in sorted(entries.items(), key=lambda v:int(v[0], 0)):
              cmd.extend([hex(int(offset,0)),str(Path("firmware/build")/path)])
          subprocess.run(cmd,check=True)
          if Path("release/ESP32-SEC-RC-merged.bin").stat().st_size<100000:
              raise SystemExit("RC image too small")
          PY
          cp /tmp/sec-rc-validation.json release/hardware-validation.json
          (cd release && sha256sum ESP32-SEC-RC-merged.bin > SHA256SUMS.txt)
      - name: Publish RC only after all gates pass
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RC_VERSION: ${{ inputs.rc_version }}
        run: |
          set -euo pipefail
          gh release view "$RC_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && {
            echo "RC tag already exists"; exit 1;
          }
          gh release create "$RC_VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ESP32-SEC $RC_VERSION — hardware-verified candidate" \
            --notes "RC promotion gated on 8 documented physical hardware checks for commit $GITHUB_SHA; see attached evidence." \
            --prerelease
