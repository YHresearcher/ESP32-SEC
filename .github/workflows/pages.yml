name: Validate ESP32-SEC website source
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check static website
        run: |
          test -s web/index.html
          test -s web/app.js
          node --check web/app.js
          echo "Release workflow owns GitHub Pages deployment with bundled firmware."
