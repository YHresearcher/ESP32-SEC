name: Build, release and publish ESP32-SEC alpha flasher
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-alpha.yml"
      - "firmware/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: esp32-sec-alpha-publish
  cancel-in-progress: false

jobs:
  alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Vietnamese LVGL font
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/sec-font
          /tmp/sec-font/bin/pip install --quiet pillow==11.3.0
          /tmp/sec-font/bin/python firmware/scripts/generate_vi_font.py
          test -s firmware/main/sec_font_vi_13.c
      - name: Build ESP32-S3 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          path: firmware

      - name: Package timestamped binaries and installer manifest
        shell: bash
        run: |
          set -euo pipefail
          STAMP="$(TZ=Asia/Ho_Chi_Minh date +'%d-%m-%Y_%H-%M')"
          TAGSTAMP="$(TZ=Asia/Ho_Chi_Minh date +'%Y%m%d-%H%M')"
          PREFIX="ESP32-SEC_v0.2.0-alpha_${STAMP}"
          echo "RELEASE_TAG=v0.2.0-alpha-${TAGSTAMP}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "BUILD_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          mkdir -p release web/firmware

          test -s firmware/build/esp32_sec.bin
          test -s firmware/build/bootloader/bootloader.bin
          test -s firmware/build/partition_table/partition-table.bin
          test -s firmware/build/flasher_args.json
          cp firmware/build/bootloader/bootloader.bin "release/${PREFIX}_bootloader.bin"
          cp firmware/build/partition_table/partition-table.bin "release/${PREFIX}_partitions.bin"
          cp firmware/build/esp32_sec.bin "release/${PREFIX}_firmware.bin"
          cp firmware/build/flasher_args.json "release/${PREFIX}_flasher_args.json"
          cp release/*.bin web/firmware/
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          src=json.loads(Path('firmware/build/flasher_args.json').read_text())
          prefix=os.environ.get('BUILD_PREFIX')
          # BUILD_PREFIX in GITHUB_ENV takes effect in the next step. Resolve from copied filename.
          if not prefix:
              prefix=next(Path('release').glob('*_firmware.bin')).name.removesuffix('_firmware.bin')
          mapping={
              'bootloader.bin':f'firmware/{prefix}_bootloader.bin',
              'partition-table.bin':f'firmware/{prefix}_partitions.bin',
              'esp32_sec.bin':f'firmware/{prefix}_firmware.bin',
          }
          files=src.get('flash_files')
          if not isinstance(files,dict): raise SystemExit('Missing flash_files in flasher_args.json')
          parts=[]
          for offset,path in files.items():
              name=Path(path).name
              if name not in mapping: raise SystemExit(f'Unexpected flash part: {path}')
              parts.append({'path':mapping[name],'offset':int(offset,0)})
          if len(parts)!=3: raise SystemExit(f'Expected 3 flash parts; got {parts}')
          parts.sort(key=lambda p:p['offset'])
          manifest={'name':'ESP32-SEC ESP32-S3 N16R8 Experimental','version':prefix,
                    'builds':[{'chipFamily':'ESP32-S3','parts':parts}]}
          Path('web/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          print('Verified manifest parts:',parts)
          PY
          # ESP Web Tools + ESP-IDF v4+ require one merged firmware image.
          # Do not pass separate bootloader/partition/app files to the browser flasher.
          python3 -m venv /tmp/sec-esptool
          /tmp/sec-esptool/bin/python -m pip install --quiet "esptool>=4.9,<6"
          python3 - <<'PYMERGE'
          import json, subprocess, sys
          from pathlib import Path
          src=json.loads(Path("firmware/build/flasher_args.json").read_text())
          entries=src.get("flash_files")
          if not isinstance(entries,dict) or len(entries)<3:
              raise SystemExit("Missing ESP-IDF flash_files mapping")
          prefix=next(Path("release").glob("*_firmware.bin")).name.removesuffix("_firmware.bin")
          merged=f"firmware/{prefix}_merged.bin"
          args=["/tmp/sec-esptool/bin/python","-m","esptool","--chip","esp32s3","merge_bin",
                "-o",f"web/{merged}","--flash_mode","dio","--flash_freq","80m","--flash_size","16MB"]
          for offset, path in sorted(entries.items(), key=lambda v:int(v[0],0)):
              file=Path("firmware/build")/path
              if not file.exists():
                  raise SystemExit(f"Missing image: {file}")
              args.extend([hex(int(offset,0)),str(file)])
          print("Merging ESP-IDF binaries for ESP Web Tools")
          subprocess.run(args,check=True)
          if Path("web",merged).stat().st_size<100000:
              raise SystemExit("Merged firmware unexpectedly small")
          # The full merged binary starts at offset zero.
          manifest={
            "name":"ESP32-SEC ESP32-S3 N16R8 Experimental",
            "version":prefix,
            "new_install_prompt_erase":True,
            "new_install_improv_wait_time":0,
            "builds":[{"chipFamily":"ESP32-S3","parts":[{"path":merged,"offset":0}]}]
          }
          # Publish immutable version-specific manifest alongside latest pointer.
          # This prevents ESP Web Tools from silently loading a newer/older build
          # than the one shown on the page when GitHub Pages or browser caches.
          payload=json.dumps(manifest,indent=2,ensure_ascii=False)
          Path("web/manifest.json").write_text(payload)
          Path("web",f"manifest-{prefix}.json").write_text(payload)
          Path("release",f"{prefix}_merged.bin").write_bytes(Path("web",merged).read_bytes())
          PYMERGE
          (cd release && sha256sum *.bin > SHA256SUMS.txt)

      - name: Publish GitHub prerelease with timestamped assets (optional)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          # ESP32-SEC v0.1.1 alpha — EXPERIMENTAL
          Hardware: ESP32-S3 N16R8, ST7789V 240x320, XPT2046 (existing Chibi wiring).
          The firmware compiled in CI but has NOT passed a physical-device smoke test.
          The public web flasher offers direct installation after the standard browser USB permission dialog.
          Choose the correct USB device. This is an experimental build and may not boot correctly.
          Includes Wi-Fi security audit, BLE discovery, local parser PoC self-test, and a nine-tile touchscreen UI.
          Unicode Vietnamese UI font; Wi-Fi/BLE passive audit, local parser self-test, and opt-in console requests for owned-device lab LED control. No jamming/disruption tools.
          Flash offsets are generated from ESP-IDF flasher_args.json, not hand-entered.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Timestamp release tag already exists: $RELEASE_TAG"
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/*.bin release/*_flasher_args.json release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ESP32-SEC v0.2.0-alpha · ${BUILD_PREFIX}" \
            --notes-file release-notes.md --prerelease

      # A GitHub Release may be blocked by repo Actions token permissions; website deploy is independent.
      - name: Upload website including firmware and manifest
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
