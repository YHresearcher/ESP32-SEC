name: ESP32-SEC firmware CI
on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: esp32-sec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware (CI only, not hardware validated)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          path: firmware
      - name: Inspect build artifacts
        shell: bash
        run: |
          find firmware/build -maxdepth 2 -type f \( -name '*.bin' -o -name 'flasher_args.json' \) -print
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: esp32-sec-unverified-ci
          path: |
            firmware/build/*.bin
            firmware/build/bootloader/*.bin
            firmware/build/partition_table/*.bin
            firmware/build/flasher_args.json
          if-no-files-found: error
          retention-days: 7
