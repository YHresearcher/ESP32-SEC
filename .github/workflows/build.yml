name: ESP32-SEC firmware CI
on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "tools/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "tools/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: esp32-sec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate Vietnamese LVGL font
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/sec-font
          /tmp/sec-font/bin/pip install --quiet pillow==11.3.0
          /tmp/sec-font/bin/python firmware/scripts/generate_vi_font.py
          test -s firmware/main/sec_font_vi_13.c
      - name: Test allowlisted lab controller
        shell: bash
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Build ESP32-S3 firmware (CI only, not hardware validated)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          path: firmware
      - name: Inspect build artifacts
        shell: bash
        run: |
          find firmware/build -maxdepth 2 -type f \( -name '*.bin' -o -name 'flasher_args.json' \) -print
      - name: Package timestamped CI build
        shell: bash
        run: |
          set -euo pipefail
          STAMP="$(TZ=Asia/Ho_Chi_Minh date +'%d-%m-%Y_%H-%M')"
          PREFIX="ESP32-SEC_${STAMP}"
          echo "ARTIFACT_NAME=${PREFIX}_CI-UNVERIFIED" >> "$GITHUB_ENV"
          mkdir -p dist
          cp firmware/build/esp32_sec.bin "dist/${PREFIX}_firmware.bin"
          cp firmware/build/bootloader/bootloader.bin "dist/${PREFIX}_bootloader.bin"
          cp firmware/build/partition_table/partition-table.bin "dist/${PREFIX}_partitions.bin"
          cp firmware/build/flasher_args.json "dist/${PREFIX}_flasher_args.json"
          cp firmware/build/esp32_sec.elf "dist/${PREFIX}_symbols.elf"
          if test -s firmware/build/esp32_sec.map; then cp firmware/build/esp32_sec.map "dist/${PREFIX}_symbols.map"; fi
          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
