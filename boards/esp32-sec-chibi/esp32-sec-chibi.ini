; ESP32-SEC "Chibi" — ESP32-S3-WROOM-1-N16R8 (16 MB flash / 8 MB octal PSRAM)
; with ST7789V 240x320 and XPT2046 resistive touch on the shared display SPI bus.
;
; Hardware-verified pin profile inherited from the owner's ModESP32/Chibi build:
;   SPI2:   SCLK=12  MOSI=11  MISO=8
;   LCD:    CS=10   DC=13    RST=14   (backlight GPIO NOT confirmed -> not driven)
;   Touch:  CS=9    IRQ=7    (shares the display SPI bus)
;
; Everything else is an *assumption* and can be remapped at runtime from
; Config > Set Device pins. See connections.md and interface.cpp.
; GPIO33-37 are reserved by octal PSRAM and are never assigned here.

[env:esp32-sec-chibi]
board = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB

; Compiles this folder's interface.cpp (mandatory — see boards/README.md).
build_src_filter = ${env.build_src_filter} +<../boards/esp32-sec-chibi>

build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1

build_flags =
	${env.build_flags}
	-Iboards/esp32-sec-chibi

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_CDC_ON_BOOT=1    ; Serial over native USB (GPIO19/20)
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM=1            ; 8 MB octal PSRAM; matches qio_opi above
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DINPUT_HANDLER_TASK_STACK_SIZE=8192

	; ==================== Feature gates ====================
	; Full Bruce feature set is intentionally kept (no LITE_VERSION, no
	; DISABLE_INTERPRETER). WiFi, BLE, RF, RFID/NFC, IR, FM, NRF24, BadUSB,
	; GPS, scripts and the web interface are all compiled in.
	-DUSB_as_HID=1                 ; BadUSB / ducky typer over native USB
	-DALLOW_ALL_GPIO_FOR_IR_RF=1   ; no fixed IR/RF wiring on this board

	-DHAS_TOUCH=1
	-DTOUCH_CTRL_XPT2046=1
	-DHAS_RESISTIVE_TOUCH=1        ; enables the on-screen touch calibration

	; ==================== Display (TFT_eSPI) ====================
	-DUSE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_CS=10
	-DTFT_DC=13
	-DTFT_RST=14
	-DTFT_MOSI=11
	-DTFT_MISO=8
	-DTFT_SCLK=12
	-DTFT_BL=-1                    ; no confirmed backlight GPIO
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; XPT2046 on the same SPI bus as the display. CYD28_TouchscreenR maps
	; these onto its CYD28_TouchR_* pins when TOUCH_XPT2046_SPI is defined.
	-DTOUCH_XPT2046_SPI=1
	-DXPT2046_TOUCH_CONFIG_INT_GPIO_NUM=7
	-DXPT2046_SPI_BUS_MOSI_IO_NUM=11
	-DXPT2046_SPI_BUS_MISO_IO_NUM=8
	-DXPT2046_SPI_BUS_SCLK_IO_NUM=12
	-DXPT2046_SPI_CONFIG_CS_GPIO_NUM=9

	; ==================== Environment Flags ====================
	-DROTATION=1                   ; Bruce UI is landscape (320x240)
	-DDEVICE_NAME='"ESP32-SEC Chibi"'
	-DBTN_ALIAS='"Ok"'

	; Curated GPIO choices for the one-pin IR / 433 MHz RF tools. These are
	; NOT wired on the stock board — connect your own module or remap in Config.
	-DIR_TX_PINS='{{"GPIO 6", 6}, {"GPIO 1", 1}, {"GPIO 2", 2}, {"GPIO 15", 15}}'
	-DIR_RX_PINS='{{"GPIO 16", 16}, {"GPIO 1", 1}, {"GPIO 2", 2}, {"GPIO 17", 17}}'
	-DRF_TX_PINS='{{"GPIO 6", 6}, {"GPIO 1", 1}, {"GPIO 2", 2}, {"GPIO 15", 15}}'
	-DRF_RX_PINS='{{"GPIO 16", 16}, {"GPIO 1", 1}, {"GPIO 2", 2}, {"GPIO 17", 17}}'

lib_deps =
	${env.lib_deps}
